services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: soiltwin-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt && python -m backend.ml.train_crop_model && python -m backend.app.rag.ingestion
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: mock
      - key: FAST_MODEL
        value: gpt-4o-mini
      - key: STRONG_MODEL
        value: gpt-4o

  # 2. React Vite Frontend Static Site
  - type: web
    name: soiltwin-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: soiltwin-backend
          property: host
